name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL base del backend para el build del frontend (ej. http://18.214.80.17:8081)"
        required: false
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test Spring Boot app
        run: |
          if [ -x "./mvnw" ]; then
            ./mvnw -B clean package
          else
            mvn -B clean package
          fi

      - name: Prepare EC2 deployment artifact
        shell: bash
        run: |
          mkdir -p ../artifact-backend
          JAR_FILE=$(ls target/*.jar | grep -v '\.original$' | head -n 1)
          test -n "$JAR_FILE"
          cp "$JAR_FILE" ../artifact-backend/app.jar

          (cd ../artifact-backend && sha256sum app.jar > app.jar.sha256)

          cat <<'EOF' > ../artifact-backend/app.env.example
          SERVER_PORT=8081
          SPRING_PROFILES_ACTIVE=prod
          DB_URL=jdbc:mysql://<HOST_DB>:3306/sonidovivo
          DB_USER=appuser
          DB_PASSWORD=cambia_esta_clave
          JWT_SECRET=cambia_este_secreto_jwt_largo
          SEED_USERS_ENABLED=false
          SEED_ADMIN_PASSWORD=demo_admin123
          SEED_SELLER_PASSWORD=demo_vendedor123
          SEED_CUSTOMER_PASSWORD=demo_cliente123
          APP_CORS_ALLOWED_ORIGIN=http://<NOMBRE-BUCKET>.s3-website-us-east-1.amazonaws.com
          EOF

          cat <<'EOF' > ../artifact-backend/sonidovivo-backend.service
          [Unit]
          Description=Sonido Vivo Spring Boot Backend
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/opt/sonidovivo-backend
          EnvironmentFile=/opt/sonidovivo-backend/app.env
          ExecStart=/usr/bin/java -jar /opt/sonidovivo-backend/app.jar
          SuccessExitStatus=143
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonidovivo-backend-${{ github.sha }}
          path: artifact-backend/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve VITE_API_URL and build frontend
        shell: bash
        run: |
          RESOLVED_API_URL="${{ inputs.api_url }}"
          if [ -z "$RESOLVED_API_URL" ]; then
            RESOLVED_API_URL="${{ vars.VITE_API_URL }}"
          fi
          if [ -z "$RESOLVED_API_URL" ]; then
            RESOLVED_API_URL="http://18.214.80.17:8081"
          fi

          echo "Using VITE_API_URL=$RESOLVED_API_URL"
          VITE_API_URL="$RESOLVED_API_URL" npm run build

          mkdir -p ../artifact-frontend/deploy
          cp -r dist ../artifact-frontend/dist

          cat <<EOF > ../artifact-frontend/BUILD_INFO.txt
          VITE_API_URL=$RESOLVED_API_URL
          COMMIT_SHA=${{ github.sha }}
          EOF

          cat <<'EOF' > ../artifact-frontend/deploy/bucket-policy.json
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::NOMBRE-DEL-BUCKET/*"
              }
            ]
          }
          EOF

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonidovivo-frontend-dist-${{ github.sha }}
          path: artifact-frontend/
          if-no-files-found: error