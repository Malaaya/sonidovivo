spring.application.name=sonidovivo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1ub3QtcHJvZHVjdGlvbi1rZXktMzItYnl0ZXM=}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed-users.enabled=${SEED_USERS_ENABLED:false}
app.seed-users.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed-users.seller-password=${SEED_SELLER_PASSWORD:}
app.seed-users.customer-password=${SEED_CUSTOMER_PASSWORD:}

#---
spring.config.activate.on-profile=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

#---
spring.config.activate.on-profile=prod
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET}
